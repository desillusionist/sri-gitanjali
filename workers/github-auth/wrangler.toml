name = "kirtan-guide-auth"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://desillusionist.github.io,http://localhost:5173"

# Secrets, set once with `npx wrangler secret put <NAME>`:
#   GITHUB_CLIENT_ID      the GitHub App's Client ID
#   GITHUB_CLIENT_SECRET  a client secret generated on the GitHub App's page
#   STATE_SECRET          any long random text (signs the sign-in round trip)
